<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Peminjaman Barang - SMK NU Ungaran</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome untuk Ikon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-content">
          <i class="fas fa-box-open"></i>
          <div>
            <h1>Sistem Peminjaman Barang</h1>
            <p>SMK NU Ungaran</p>
          </div>
        </div>
      </header>

      <main>
        <section class="card form-card">
          <h2><i class="fas fa-plus-circle"></i> Form Peminjaman</h2>
          <form id="formPeminjaman">
            <div class="form-grid">
              <div class="form-group">
                <label for="namaPeminjam"
                  ><i class="fas fa-user"></i> Nama Peminjam</label
                >
                <input type="text" id="namaPeminjam" required />
              </div>
              <div class="form-group">
                <label for="guruPengampu"
                  ><i class="fas fa-chalkboard-teacher"></i> Guru
                  Pengampu</label
                >
                <input type="text" id="guruPengampu" required />
              </div>
              <div class="form-group">
                <label for="kelas"><i class="fas fa-school"></i> Kelas</label>
                <input
                  type="text"
                  id="kelas"
                  placeholder="Contoh: XI TKJ 1"
                  required
                />
              </div>
              <div class="form-group">
                <label for="namaBarang"
                  ><i class="fas fa-cube"></i> Nama Barang</label
                >
                <input type="text" id="namaBarang" required />
              </div>
              <div class="form-group">
                <label for="jumlah"
                  ><i class="fas fa-sort-numeric-up"></i> Jumlah</label
                >
                <input type="number" id="jumlah" min="1" required />
              </div>
              <div class="form-group">
                <label for="waktuPeminjaman"
                  ><i class="fas fa-calendar-alt"></i> Waktu Peminjaman</label
                >
                <input type="datetime-local" id="waktuPeminjaman" required />
              </div>
            </div>
            <button type="submit" class="btn-submit">
              <i class="fas fa-paper-plane"></i> Ajukan Peminjaman
            </button>
          </form>
        </section>

        <section class="card data-card">
          <h2><i class="fas fa-list-alt"></i> Data Peminjaman</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Peminjam</th>
                  <th>Guru Pengampu</th>
                  <th>Kelas</th>
                  <th>Nama Barang</th>
                  <th>Jumlah</th>
                  <th>Waktu Peminjaman</th>
                  <th>Status</th>
                  <!-- Ganti Aksi menjadi Status -->
                </tr>
              </thead>
              <tbody id="tabelData">
                <!-- Data akan ditampilkan di sini oleh JavaScript -->
              </tbody>
            </table>
          </div>
        </section>
      </main>

      <!-- Notifikasi -->
      <div id="notification" class="notification"></div>

      <footer>
        <p>&copy; 2024 - Developed for <strong>SMK NU Ungaran</strong></p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
